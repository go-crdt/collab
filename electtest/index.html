<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>collab host election proof</title>
  </head>
  <body>
    <!-- The Go toolchain's own loader, copied beside the wasm by the test. -->
    <script src="wasm_exec.js"></script>
    <script>
      (async () => {
        try {
          const go = new Go();
          const result = await WebAssembly.instantiateStreaming(
            fetch("elect.wasm"),
            go.importObject,
          );
          // Does not resolve: the program blocks so a host keeps its lock.
          go.run(result.instance);
        } catch (err) {
          console.log("DONE page failed to run the wasm: " + err);
          globalThis.__err = "wasm did not run: " + err;
        }
      })();
    </script>
  </body>
</html>
