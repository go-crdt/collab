// Package collab.v1 carries a collaborative editing session.
//
// The service is deliberately thin. Because the document is a CRDT, the server
// never transforms an operation and never decides an outcome — it applies what
// it is sent to its own replica, hands it to everyone else, and can therefore be
// replaced, restarted, or run in several copies without any client noticing.
syntax = "proto3";

package collab.v1;

option go_package = "github.com/go-crdt/collab/collabpb";

// A document is not one structure. It holds named parts — the text of a file,
// the comments anchored into it, the messages beside it, the cells of a sheet —
// and they travel together: one snapshot, one version, one decision about who
// may open it. Keeping them apart would mean several snapshots persisted at
// several moments, with no instant at which the set of them agrees.

// Collab is one bidirectional stream per participant per document.
service Collab {
  // Session carries a participant's whole involvement with one document: it
  // opens with a Join, and from then on operations and presence flow both ways
  // until either side hangs up.
  rpc Session(stream ClientMessage) returns (stream ServerMessage);
}

// ClientMessage is anything a participant sends.
message ClientMessage {
  oneof body {
    Join join = 1;
    Operations operations = 2;
    Presence presence = 3;
    Acknowledge acknowledge = 4;
  }
}

// ServerMessage is anything the server sends back.
message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Operations operations = 2;
    Presence presence = 3;
  }
}

// Join opens a session. It must be the first message, and it must not be sent
// twice.
message Join {
  // document names the document to edit. It is opened if it does not exist.
  string document = 1;

  // site is the participant's replica identity, which must be distinct from
  // every other participant's. See crdt.DeriveSiteID.
  uint64 site = 2;

  // have is the participant's encoded version, sent when rejoining a document
  // it already holds. The server then replies with only the operations that are
  // missing, instead of the whole document. Empty means "send everything".
  //
  // A document is a set of named parts, so this is a version per part —
  // crdt.CompositeVersion, not one vector.
  bytes have = 3;

  // speaks is what the participant says it understands: collab.Capabilities,
  // encoded. Empty from a participant that does not say, which every one built
  // before this is.
  //
  // The server keeps it and uses it to avoid sending a snapshot in a format the
  // participant cannot read — a snapshot travels, and a reader knows the version
  // byte or refuses the bytes, so there is nothing to fall back on once it has
  // been sent.
  bytes speaks = 4;
}

// Welcome answers a Join with the state of the document at that moment.
message Welcome {
  // snapshot is the whole document, sent when the participant is new to it or
  // too far behind to catch up cheaply. Empty when operations were sent instead.
  bytes snapshot = 1;

  // operations catches up a participant that supplied a version vector.
  bytes operations = 2;

  // presence is the state of everyone already in the document.
  repeated bytes presence = 3;

  // version is the server's encoded version, per part. A participant answers
  // with whatever the server is missing, which is what lets work done while
  // disconnected reach everyone else rather than being stranded.
  bytes version = 4;

  // speaks is what the server says it understands: collab.Capabilities,
  // encoded. Empty from a server that does not say.
  //
  // A federated link is a participant, so this is how the server it follows
  // learns what it can be sent.
  bytes speaks = 5;
}

// Operations carries operations addressed to the parts of a document, encoded
// by crdt.AppendPartOps. Applying them is idempotent and order-independent, so
// this message needs no sequencing of its own.
//
// The part each operation belongs to travels inside those bytes rather than in
// a field here, which is why holding several structures in one document changed
// nothing about this message. It is also what lets one message carry an edit to
// the text and an edit to a comment on it: they arrive together or not at all.
message Operations {
  bytes operations = 1;
}

// Presence carries one encoded awareness update: a cursor, a selection, or a
// departure. It is never persisted.
message Presence {
  bytes update = 1;
}

// Acknowledge carries a participant's version and its clocks: what it has
// applied as of sending, and how far each of its map parts has counted. It is
// how the server learns what every participant has certainly seen, which a
// version safe to collect against needs, and how far each of them will write
// next, which such a version does not say and cannot.
//
// The clocks are the second half because a version does not bound them. A site
// that has seen nothing writes at clock one however far along everyone else is,
// and a write carrying such a clock can beat a deletion everybody has already
// delivered. A participant that says where its own clock stands says the one
// thing that bounds what it will send: a Lamport clock only goes up.
//
// Nothing depends on one arriving. A participant that never sends one holds the
// server's answer back rather than making it wrong, which is the safe
// direction: a replica nobody has heard from is exactly the replica that might
// not have seen the operation in question.
message Acknowledge {
  bytes version = 1;
  // clocks is a marshalled crdt.CompositeClocks: how far each map part of this
  // participant's replica has counted. Absent from an older participant, which
  // holds the server's answer back rather than making it wrong.
  bytes clocks = 2;
}
