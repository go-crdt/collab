name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
#
# COVERPKG deliberately names only this module's own package: collabpb is
# generated by protoc, and holding generated code to a coverage bar measures the
# generator, not this project.
env:
  COVERPKG: github.com/go-crdt/collab

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  # The generated code must match the .proto it came from, or the wire format
  # and the Go API can drift apart silently.
  proto-sync:
    name: generated code in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          PATH="$(go env GOPATH)/bin:$PATH" protoc \
            --proto_path=collabpb \
            --go_out=. --go_opt=module=github.com/go-crdt/collab \
            --go-grpc_out=. --go-grpc_opt=module=github.com/go-crdt/collab \
            collabpb/collab.proto
      - name: Fail if the generated code drifted
        run: |
          # Only the message and service definitions are compared: the header
          # records the protoc version, which differs between machines.
          if ! git diff --exit-code --ignore-matching-lines='^//.*protoc' -- collabpb; then
            echo "::error::collabpb is out of sync with collab.proto — regenerate it"
            exit 1
          fi

  # Build, vet, race-test, and enforce 100% statement coverage on three OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          go test -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 30
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # The PostgreSQL store is tested against PostgreSQL. A store that has never
  # spoken to a database has not been tested, so the happy paths here are the
  # ones only a real server can exercise — and COLLAB_REQUIRE_POSTGRES turns a
  # missing database into a failure rather than a skipped test.
  postgres-store:
    name: postgres store
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COLLAB_POSTGRES: postgres://collab:collab@localhost:5432/collab?sslmode=disable
      COLLAB_REQUIRE_POSTGRES: "1"
    defaults:
      run:
        working-directory: pgstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race -v ./...
      - name: Test + 100% coverage gate
        run: |
          go test -coverpkg=github.com/go-crdt/collab/pgstore -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 15
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }


  # The git store keeps documents in a git repository. Nothing here needs a
  # server: git is a filesystem format, so the tests build real repositories in
  # temporary directories and read them back.
  #
  # That includes the remote. A bare repository in a temporary directory is a
  # remote as far as go-git is concerned, reached over the same transport it
  # reaches a host over, so the tests that push and pull have pushed and pulled
  # rather than pretended to. What they need is the git binaries the runner
  # already has, and no network at all.
  #
  # The coverage gate is SPLIT, and deliberately so. gitstore.go is the logic —
  # what a document is, where it goes, how a release is a tag on a commit that
  # already exists — and it is held to the org's 100%. gogit.go is the adapter,
  # a wrapper per call whose uncovered lines are `if err != nil { wrap }` around
  # go-git; reaching those THROUGH go-git means corrupting a repository in the
  # particular way that displeases one version of one library, which tests the
  # dependency and not this project. They are reached through the repository
  # interface instead, by a test that says "staging fails" and means it — so
  # the adapter's number is REPORTED here, never gated, and lowering the gate to
  # cover it would be the one thing this split exists to avoid.
  git-store:
    name: git store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...
      - name: Test + 100% coverage gate on the logic
        run: |
          go test -coverpkg=github.com/go-crdt/collab/gitstore -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 40
          # Statement counts live in the profile itself: each line is
          #   file.go:from,to numberOfStatements timesExecuted
          # so a per-file percentage is a sum over the lines naming that file.
          pct() {
            awk -v want="$1" '
              $1 ~ want {
                n = split($0, a, " "); stmts = a[n-1]; count = a[n]
                total += stmts; if (count + 0 > 0) covered += stmts
              }
              END { if (total == 0) print "0.0"; else printf "%.1f", covered * 100 / total }
            ' cover.out
          }
          logic=$(pct 'gitstore/gitstore[.]go:')
          adapter=$(pct 'gitstore/gogit[.]go:')
          echo "logic (gitstore.go):  ${logic}%"
          echo "adapter (gogit.go):   ${adapter}%  — reported, not gated"
          # A file that matched nothing would report 0.0 and fail, so a rename
          # cannot silently empty this gate.
          awk -v t="$logic" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::the logic is at ${logic}% and the gate is 100%"; exit 1; }
  # The point of the whole design is that a browser runs the same merge logic as
  # the server. This job proves it: two participants compiled to WebAssembly and
  # run by Node, editing concurrently with a native one through a real WebSocket,
  # all three converging. COLLAB_REQUIRE_WASM turns a missing toolchain into a
  # failure, so this can never pass by quietly skipping.
  wasm:
    name: js/wasm end to end
    runs-on: ubuntu-latest
    env:
      COLLAB_REQUIRE_WASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: GOOS=js GOARCH=wasm go build ./...
      - name: Three replicas, two runtimes
        run: go test -v -run 'TestWasmConverges|TestOverWebSocket' ./...
      # And the surface the consumer actually has. loom's editor is TypeScript
      # and cannot call Go, so the binding in ./wasm is what has to work: a page
      # joining a document a native participant is already editing, driven
      # through globalThis.collab and nothing else.
      - name: A page and a native participant
        run: go test -v -run TestTheJavaScriptAPIConverges ./...
      # And the code that only exists in a browser, run in one.
      #
      # This lane built for js/wasm and ran nothing under it, so anything
      # guarded by that tag — the WebSocket a page opens, the data channel two
      # pages share — was compiled and never executed. Building is not running,
      # and the difference is where a browser-only path goes wrong.
      - name: The browser build's own tests
        run: |
          GOOS=js GOARCH=wasm go test -v \
            -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./... | tee js.log
          grep -q 'two browsers, no server' js.log || {
            echo "::error::the browser-to-browser session did not run"; exit 1; }

  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go env GOARCH && go test ./...

  # Emulated architectures run everything except the WebAssembly test: Node under
  # qemu would prove nothing about this package, so it is skipped explicitly
  # rather than left to fail for the wrong reason.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    env:
      COLLAB_SKIP_WASM: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # This has not hung here. It hung in go-crdt/crdt, on the same runner
      # image and the same one-line install, for the better part of an hour and
      # more than once — and bounding it is what identified the culprit: three
      # attempts of ten minutes each produced not one line of output from
      # apt-get update, while the install itself was never reached. The cure is
      # copied rather than waited for.
      #
      # The runner image already ships apt's package lists, so the install
      # usually needs no refresh at all. It is tried on the lists that are there
      # first, and they are only refreshed if that was not enough. apt is also
      # told to give up on a stuck mirror rather than sit on it, which is what
      # made the outer timeout the only thing stopping it.
      - name: Install qemu-user-static
        run: |
          apt=(-y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          if timeout 240 sudo apt-get install "${apt[@]}" qemu-user-static; then
            exit 0
          fi
          for attempt in 1 2; do
            echo "::warning::the runner's package lists were not enough; refreshing them (attempt $attempt)"
            timeout 240 sudo apt-get update "${apt[@]}" || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
            sudo dpkg --configure -a || true
            if timeout 240 sudo apt-get install "${apt[@]}" qemu-user-static; then
              exit 0
            fi
          done
          echo "::error::qemu-user-static could not be installed"
          exit 1
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...
